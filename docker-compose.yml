services:
  backend:
    build: .
    container_name: synthetic-sandbox-backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
    environment:
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      - OPENAI_API_KEY=ollama
      - LLM_MODEL=qwen2.5:7b
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: .
    container_name: synthetic-sandbox-frontend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
      - DEFAULT_OLLAMA_URL=http://host.docker.internal:11434/v1
    depends_on:
      - backend